# hypridle: screens off after 10 minutes idle
# (dispatchers use Hyprland's Lua syntax: hyprctl dispatch 'hl.dsp.…')

general {
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'     # turn the screens on after resume without a key press
}

listener {
    timeout = 600                                                         # 10min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'         # screens off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'           # screens back on at the first input
}
