# makepkg's per-user settings (yay builds AUR packages with it), read after /etc/makepkg.conf.

# No -debug package next to each AUR build: Arch's default turns `debug` on, so every yay install also
# installed <name>-debug (detached symbols, tens of MB each). Only that entry changes: the rest of the
# defaults stay Arch's, whatever they become.
OPTIONS=("${OPTIONS[@]/#debug/!debug}")
