# Rosé Pine (main), mapped the same way as quickshell/config/Theme.qml
background = 0xFF191724        # base         — Theme.bg (bar, dropdowns)
base = 0xFF26233a              # overlay      — Theme.surface (rows, buttons, inputs)
alternate_base = 0xFF403d52    # highlightMed — hovered / unfocused input border

text = 0xFFe0def4              # text         — Theme.fg
bright_text = 0xFFebbcba       # rose
link_text = 0xFF9ccfd8         # foam

accent = 0xFFc4a7e7            # iris         — Theme.accent / Theme.border
accent_secondary = 0xFF9ccfd8  # foam

# same font as the bar (Theme.font); plain "JetBrains Mono" isn't installed
font_family = JetBrainsMono Nerd Font
font_family_monospace = JetBrainsMonoNL Nerd Font   # same as kitty

# point sizes; Theme.fontSize is 13 px ≈ 10 pt, same as kitty
font_size = 10
small_font_size = 9
h3_size = 11
h2_size = 12
h1_size = 14

icon_theme = rose-pine-icons

# keep in sync with Theme.radius / Theme.radiusLarge (quickshell/config/Theme.qml)
rounding_small = 6
rounding_large = 12
