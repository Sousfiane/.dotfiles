# xdg-desktop-portal-hyprland: screen sharing. Read when the portal starts:
# systemctl --user restart xdg-desktop-portal-hyprland after a change
screencopy {
    max_fps = 0                         # as fast as the screen updates
    allow_token_by_default = true       # the picker's "Remember" starts on
    # Quickshell's share panel instead of hyprland-share-picker (local/bin/share-picker, which falls back to
    # it when Quickshell isn't running)
    custom_picker_binary = share-picker
}
