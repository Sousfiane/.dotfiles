# PAM stack used by the Quickshell lockscreen (modules/lock): the system's password check, as sudo and the login
# screens have it, so pam_faillock counts wrong passwords here too (/etc/security/faillock.conf: by default 3 in
# 15 minutes lock the account for 10, everywhere). The path is absolute: Quickshell loads this file from its own
# folder, and PAM looks for a relative include there, not in /etc/pam.d.
auth include /etc/pam.d/system-auth
