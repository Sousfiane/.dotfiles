include current-theme.conf

enable_audio_bell no

remember_window_size  no
initial_window_width  650
initial_window_height 450

font_family      JetBrainsMonoNL NF
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 10.0

cursor_shape block
shell_integration no-cursor

background_opacity 0.8

# top right bottom left — less on top so the prompt sits close to the title bar
window_padding_width 3 7 7 7
# put leftover pixels at the bottom/right instead of splitting them above the first line
placement_strategy top-left


